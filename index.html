<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PediDose | High-Precision Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --text-primary: #F5F5F5;
            --text-secondary: #A0A0A0;
            --accent-color: #CCFF00;
            --warning-color: #FF7F50;
            --border-color: #333333;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.5;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            border: 2px solid var(--border-color);
            background-color: var(--surface-color);
            padding: 2rem;
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        h1 {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            letter-spacing: -1px;
            color: var(--accent-color);
        }

        .version {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: block;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.25rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .search-container {
            position: relative;
            width: 100%;
        }

        #search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface-color);
            border: 1px solid var(--accent-color);
            border-top: none;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        #search-results.active {
            display: block;
        }

        .search-item {
            padding: 0.75rem;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item:hover, .search-item.selected {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        label {
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        input, select {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            width: 100%;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .weight-input-container {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: flex-end;
        }

        .badge {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            margin-top: 0.5rem;
            display: inline-block;
        }

        .badge.warning {
            border-color: var(--warning-color);
            color: var(--warning-color);
        }

        .result-card {
            border: 2px solid var(--accent-color);
            padding: 1.5rem;
            background: rgba(204, 255, 0, 0.05);
            display: none;
        }

        .result-card.active {
            display: block;
        }

        .result-header {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-family: var(--font-mono);
        }

        .result-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .result-value {
            font-weight: bold;
            text-align: right;
        }

        .highlight {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .warning-block {
            border: 1px solid var(--warning-color);
            padding: 1rem;
            color: var(--warning-color);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        .warning-block.active {
            display: block;
        }

        .btn-copy {
            width: 100%;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 1rem;
            font-family: var(--font-mono);
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }

        .btn-copy:hover {
            opacity: 0.9;
        }

        .btn-copy:active {
            transform: translateY(1px);
        }

        select option {
            background-color: var(--surface-color);
            color: var(--text-primary);
        }

        @media (max-width: 480px) {
            .grid-inputs {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PEDIDOSE.SYS</h1>
            <span class="version">v1.0.42</span>
        </header>

        <section id="patient-data">
            <span class="section-title">01. Patient Data</span>
            <div class="grid-inputs">
                <div class="input-group">
                    <label>Years</label>
                    <input type="number" id="age-y" value="0" min="0" max="18">
                </div>
                <div class="input-group">
                    <label>Months</label>
                    <input type="number" id="age-m" value="0" min="0" max="11">
                </div>
                <div class="input-group">
                    <label>Weeks</label>
                    <input type="number" id="age-w" value="0" min="0" max="4">
                </div>
                <div class="input-group">
                    <label>Days</label>
                    <input type="number" id="age-d" value="0" min="0" max="31">
                </div>
            </div>
            <div class="weight-input-container">
                <div class="input-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" placeholder="Leave blank to estimate" step="0.1">
                </div>
                <div id="weight-badge-container"></div>
            </div>
        </section>

        <section id="drug-selection">
            <span class="section-title">02. Medication</span>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label>Drug Name</label>
                <div class="search-container">
                    <input type="text" id="drug-search" placeholder="Type to search drugs..." autocomplete="off">
                    <div id="search-results"></div>
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 1rem;">
                <label>Indication</label>
                <select id="indication-list" disabled>
                    <option value="">-- Select Indication --</option>
                </select>
            </div>
            <div class="input-group">
                <label>Formulation</label>
                <select id="formulation-list" disabled>
                    <option value="">-- Select Formulation --</option>
                </select>
            </div>
        </section>

        <section id="output">
            <span class="section-title">03. Calculation Output</span>
            <div id="warning-box" class="warning-block"></div>
            
            <div id="result-card" class="result-card">
                <div class="result-header" id="res-drug-name">PARACETAMOL</div>
                <div class="result-row">
                    <span class="result-label">Indication</span>
                    <span class="result-value" id="res-indication">Fever</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Target Dose</span>
                    <span class="result-value" id="res-target-dose">15 mg/kg</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Calculated Dose</span>
                    <span class="result-value" id="res-calc-mg">150 mg</span>
                </div>
                <div class="result-row" style="margin-top: 1rem;">
                    <span class="result-label">Volume (Precise)</span>
                    <span class="result-value highlight" id="res-vol-ml">3.12 ml</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Practical Dose</span>
                    <span class="result-value highlight" id="res-practical">3.25 ml (approx 3/4 TSF)</span>
                </div>
                <div class="result-row" style="margin-top: 1rem;">
                    <span class="result-label">Frequency</span>
                    <span class="result-value" id="res-freq">TDS (Three times daily)</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Notes</span>
                    <span class="result-value" id="res-note" style="max-width: 60%;">Take after food</span>
                </div>
                
                <button class="btn-copy" id="btn-copy">Copy Prescription</button>
            </div>
        </section>
    </div>

    <script>
        let drugData = [];
        let selectedDrugIndex = -1;
        let focusedSearchIndex = -1;

        const elements = {
            ageY: document.getElementById('age-y'),
            ageM: document.getElementById('age-m'),
            ageW: document.getElementById('age-w'),
            ageD: document.getElementById('age-d'),
            weight: document.getElementById('weight'),
            weightBadge: document.getElementById('weight-badge-container'),
            drugSearch: document.getElementById('drug-search'),
            searchResults: document.getElementById('search-results'),
            indicationList: document.getElementById('indication-list'),
            formulationList: document.getElementById('formulation-list'),
            resultCard: document.getElementById('result-card'),
            warningBox: document.getElementById('warning-box'),
            btnCopy: document.getElementById('btn-copy'),
            // Result fields
            resDrugName: document.getElementById('res-drug-name'),
            resIndication: document.getElementById('res-indication'),
            resTargetDose: document.getElementById('res-target-dose'),
            resCalcMg: document.getElementById('res-calc-mg'),
            resVolMl: document.getElementById('res-vol-ml'),
            resPractical: document.getElementById('res-practical'),
            resFreq: document.getElementById('res-freq'),
            resNote: document.getElementById('res-note')
        };

        async function loadDatabase() {
            try {
                const response = await fetch('drugs.json');
                drugData = await response.json();
            } catch (error) {
                console.error('Error loading drug database:', error);
                elements.warningBox.textContent = "CRITICAL ERROR: Failed to load drug database.";
                elements.warningBox.classList.add('active');
            }
        }

        function filterDrugs(query) {
            elements.searchResults.innerHTML = '';
            focusedSearchIndex = -1;
            if (!query) {
                elements.searchResults.classList.remove('active');
                return;
            }

            const filtered = drugData
                .map((drug, index) => ({ drug, index }))
                .filter(item => item.drug.drugName.toLowerCase().includes(query.toLowerCase()));

            if (filtered.length > 0) {
                filtered.forEach((item, i) => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.id = `search-item-${i}`;
                    div.textContent = item.drug.drugName;
                    div.addEventListener('click', () => selectDrug(item.index));
                    elements.searchResults.appendChild(div);
                });
                elements.searchResults.classList.add('active');
            } else {
                elements.searchResults.classList.remove('active');
            }
        }

        function selectDrug(index) {
            selectedDrugIndex = index;
            const drug = drugData[index];
            elements.drugSearch.value = drug.drugName;
            elements.searchResults.classList.remove('active');
            
            // Populate Indications
            elements.indicationList.innerHTML = '<option value="">-- Select Indication --</option>';
            drug.indications.forEach((ind, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = ind.label;
                elements.indicationList.appendChild(opt);
            });
            elements.indicationList.disabled = false;
            elements.indicationList.value = 0; // Auto-select first indication

            // Populate Formulations
            elements.formulationList.innerHTML = '<option value="">-- Select Formulation --</option>';
            drug.formulations.forEach((form, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${form.type} (${form.strength})`;
                elements.formulationList.appendChild(opt);
            });
            elements.formulationList.disabled = false;
            elements.formulationList.value = 0; // Auto-select first formulation

            calculateLogic();
        }

        function getAgeInDays() {
            const y = parseInt(elements.ageY.value) || 0;
            const m = parseInt(elements.ageM.value) || 0;
            const w = parseInt(elements.ageW.value) || 0;
            const d = parseInt(elements.ageD.value) || 0;
            return (y * 365) + (m * 30.44) + (w * 7) + d;
        }

        function getAgeInMonths() {
            const y = parseInt(elements.ageY.value) || 0;
            const m = parseInt(elements.ageM.value) || 0;
            return (y * 12) + m;
        }

        function estimateWeight() {
            const y = parseInt(elements.ageY.value) || 0;
            const m = parseInt(elements.ageM.value) || 0;
            const months = (y * 12) + m;

            if (months < 12) {
                return (0.5 * months) + 4;
            } else if (y >= 1 && y <= 5) {
                return (2 * y) + 8;
            } else if (y >= 6 && y <= 12) {
                return (3 * y) + 7;
            } else {
                return (y * 3) + 7; // Extension of APLS for older kids if needed
            }
        }

        function roundToPractical(ml) {
            const rawTsf = ml / 5;
            const wholeTsf = Math.floor(rawTsf);
            const decimalTsf = rawTsf - wholeTsf;

            // Define the allowed fractions
            const fractions = [
                { val: 0, label: "" },
                { val: 0.25, label: "1/4" },
                { val: 0.33, label: "1/3" },
                { val: 0.5, label: "1/2" },
                { val: 0.66, label: "2/3" },
                { val: 0.75, label: "3/4" },
                { val: 1.0, label: "1" }
            ];

            // Find closest fraction
            let closest = fractions[0];
            let minDiff = Math.abs(decimalTsf - fractions[0].val);

            for (let i = 1; i < fractions.length; i++) {
                const diff = Math.abs(decimalTsf - fractions[i].val);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = fractions[i];
                }
            }

            let finalTsfValue = wholeTsf + closest.val;
            let finalTsfLabel = "";

            if (closest.val === 1.0) {
                finalTsfLabel = (wholeTsf + 1).toString();
            } else {
                if (wholeTsf === 0) {
                    finalTsfLabel = closest.label || "0";
                } else {
                    finalTsfLabel = closest.label ? `${wholeTsf} ${closest.label}` : wholeTsf.toString();
                }
            }

            // Also update the mL to match the rounded TSF for clinical consistency
            const roundedMl = finalTsfValue * 5;

            return {
                ml: roundedMl.toFixed(2),
                tsf: finalTsfLabel
            };
        }

        function calculateLogic() {
            if (selectedDrugIndex === -1) {
                elements.resultCard.classList.remove('active');
                return;
            }

            const drug = drugData[selectedDrugIndex];
            const indication = drug.indications[elements.indicationList.value];
            const formulation = drug.formulations[elements.formulationList.value];
            
            if (!indication || !formulation) return;

            // Weight logic
            let weight = parseFloat(elements.weight.value);
            let isEstimated = false;
            if (isNaN(weight) || weight <= 0) {
                weight = estimateWeight();
                isEstimated = true;
                elements.weightBadge.innerHTML = `<span class="badge">Estimated (APLS): ${weight.toFixed(1)}kg</span>`;
            } else {
                elements.weightBadge.innerHTML = "";
            }

            // Age validation
            const ageDays = getAgeInDays();
            const ageMonths = getAgeInMonths();
            let warnings = [];

            if (ageDays < drug.ageMinDays) {
                warnings.push(`Patient is too young for this drug (Min: ${drug.ageMinDays} days).`);
            }
            if (ageMonths > drug.ageMaxMonths) {
                warnings.push(`Patient age exceeds recommended limit (Max: ${drug.ageMaxMonths} months).`);
            }

            // Dose calculation
            let targetMg = indication.dose * weight;
            let freqDivisor = 1;
            
            // Handle per day vs per dose
            if (indication.unit.includes('/day')) {
                const freqMap = { 'OD': 1, 'BD': 2, 'TDS': 3, 'QDS': 4, 'PRN': 1 };
                freqDivisor = freqMap[indication.frequency] || 1;
                targetMg = targetMg / freqDivisor;
            }

            // Safety Guardrails
            if (indication.maxSingleDose && targetMg > indication.maxSingleDose) {
                targetMg = indication.maxSingleDose;
                warnings.push(`Capped at Max Single Dose (${indication.maxSingleDose}mg).`);
            }

            const totalDailyMg = targetMg * freqDivisor;
            if (indication.maxDailyDose && totalDailyMg > indication.maxDailyDose) {
                // Adjust single dose if daily max is exceeded
                targetMg = indication.maxDailyDose / freqDivisor;
                warnings.push(`Capped at Max Daily Dose (${indication.maxDailyDose}mg).`);
            }

            const preciseMl = targetMg / formulation.concentration;
            const practical = roundToPractical(preciseMl);

            renderUI(drug, indication, formulation, targetMg, preciseMl, practical, warnings);
        }

        function renderUI(drug, indication, formulation, mg, ml, practical, warnings) {
            elements.resDrugName.textContent = drug.drugName.toUpperCase();
            elements.resIndication.textContent = indication.label;
            elements.resTargetDose.textContent = `${indication.dose} ${indication.unit}`;
            elements.resCalcMg.textContent = `${mg.toFixed(1)} mg`;
            elements.resVolMl.textContent = `${ml.toFixed(2)} ml`;
            elements.resPractical.textContent = `${practical.ml} ml (approx ${practical.tsf} TSF)`;
            elements.resFreq.textContent = indication.frequency;
            elements.resNote.textContent = indication.note || "N/A";

            if (warnings.length > 0) {
                elements.warningBox.innerHTML = warnings.join('<br>');
                elements.warningBox.classList.add('active');
            } else {
                elements.warningBox.classList.remove('active');
            }

            elements.resultCard.classList.add('active');
        }

        // Event Listeners
        elements.drugSearch.addEventListener('input', (e) => {
            filterDrugs(e.target.value);
            if (e.target.value === '') {
                selectedDrugIndex = -1;
                elements.indicationList.disabled = true;
                elements.formulationList.disabled = true;
                calculateLogic();
            }
        });

        elements.drugSearch.addEventListener('keydown', (e) => {
            const items = elements.searchResults.querySelectorAll('.search-item');
            if (!elements.searchResults.classList.contains('active') || items.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                focusedSearchIndex = (focusedSearchIndex + 1) % items.length;
                updateSearchFocus(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                focusedSearchIndex = (focusedSearchIndex - 1 + items.length) % items.length;
                updateSearchFocus(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (focusedSearchIndex > -1) {
                    items[focusedSearchIndex].click();
                }
            }
        });

        function updateSearchFocus(items) {
            items.forEach((item, i) => {
                if (i === focusedSearchIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        document.addEventListener('click', (e) => {
            if (!elements.drugSearch.contains(e.target) && !elements.searchResults.contains(e.target)) {
                elements.searchResults.classList.remove('active');
            }
        });

        [elements.indicationList, elements.formulationList, elements.ageY, elements.ageM, elements.ageW, elements.ageD, elements.weight].forEach(el => {
            el.addEventListener('input', calculateLogic);
        });

        elements.btnCopy.addEventListener('click', () => {
            if (selectedDrugIndex === -1) return;
            const drug = drugData[selectedDrugIndex].drugName;
            const formulation = elements.formulationList.options[elements.formulationList.selectedIndex].text;
            const ml = elements.resVolMl.textContent;
            const tsf = elements.resPractical.textContent.split('(')[1].replace(')', '');
            const freq = elements.resFreq.textContent;
            const ind = elements.resIndication.textContent;

            const text = `${drug.toUpperCase()} [${formulation}] | DOSE: ${ml} (${tsf}) | FREQ: ${freq} | INDICATION: ${ind}`;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = elements.btnCopy.textContent;
                elements.btnCopy.textContent = "COPIED!";
                elements.btnCopy.style.background = "#FFFFFF";
                setTimeout(() => {
                    elements.btnCopy.textContent = originalText;
                    elements.btnCopy.style.background = "var(--accent-color)";
                }, 2000);
            });
        });

        // Initialize
        loadDatabase();
    </script>
</body>
</html>
